[project]
name = "wiki-lake"
version = "0.1.0"
description = "Streaming and batch data lake on AWS, fed by the live stream of Wikipedia edits."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# Installed into the producer's container image, and locally as part of dev.
producer = [
    "boto3>=1.35",
    "requests>=2.32",
]
dev = [
    { include-group = "producer" },
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
